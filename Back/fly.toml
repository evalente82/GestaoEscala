app = 'back-gestao-escala'
primary_region = 'gru'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1 # Para testes
  processes = ['app']

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_Kestrel__Certificates__Default__Path = "/app/certificado.pfx"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1