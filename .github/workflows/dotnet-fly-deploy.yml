# Nome do seu workflow. Aparecerá na aba "Actions" do GitHub.
name: Backend .NET - Build, Test and Deploy to Fly.io

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Back/GestaoEscalaPermutas.sln

      - name: Build
        run: dotnet build Back/GestaoEscalaPermutas.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Back/GestaoEscalaPermutas.sln --configuration Release --verbosity normal

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Back/GestaoEscalaPermutas.sln

      - name: Publish project
        run: dotnet publish Back/GestaoEscalaPermutas.Server/GestaoEscalaPermutas.Server.csproj \
               -c Release -o out --runtime linux-x64 --self-contained false /p:PublishTrimmed=false

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --no-cache
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
